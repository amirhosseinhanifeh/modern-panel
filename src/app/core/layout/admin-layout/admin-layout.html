<div class="flex h-screen w-full overflow-hidden bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300" dir="rtl">
  
  <!-- سایدبار -->
  <aside 
    class="flex flex-col bg-slate-900 text-slate-200 transition-all duration-300 ease-in-out shrink-0 border-l border-slate-800"
    [class.w-64]="!collapsed()"
    [class.w-20]="collapsed()">
    
    <!-- لوگو و تیتر -->
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
      @if (!collapsed()) {
        <h2 class="text-lg font-bold text-white tracking-wide">پنل مدیریت</h2>
      }
      <button 
        (click)="toggleSidebar()" 
        class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer mr-auto">
        ☰
      </button>
    </div>

    <!-- منوی ناوبری -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a 
        routerLink="/admin/dashboard" 
        routerLinkActive="bg-blue-600 text-white font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 transition-all group">
        <span class="text-xl">📊</span>
        @if (!collapsed()) {
          <span class="text-sm">داشبورد</span>
        }
      </a>

      <a 
        routerLink="/admin/users" 
        routerLinkActive="bg-blue-600 text-white font-semibold"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:bg-slate-800 transition-all group">
        <span class="text-xl">👥</span>
        @if (!collapsed()) {
          <span class="text-sm">کاربران</span>
        }
      </a>
    </nav>

    <!-- فوتر سایدبار / اطلاعات لاگین -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/40">
      <div class="flex items-center justify-between">
        @if (!collapsed()) {
          <div class="flex flex-col">
            <span class="text-xs font-medium text-white">{{ currentUser()?.name }}</span>
            <span class="text-[10px] text-slate-400 font-mono">{{ currentUser()?.email }}</span>
          </div>
        }
        <button 
          (click)="logout()" 
          title="خروج از حساب"
          class="p-2 text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition-colors cursor-pointer">
          🚪
        </button>
      </div>
    </div>
  </aside>

  <!-- محتوای سمت چپ -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- هدر بالای صفحه -->
    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between px-6 shrink-0 transition-colors">
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400 font-medium">وضعیت سیستم:</span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          آنلاین
        </span>
      </div>

      <!-- ابزارهای سمت چپ هدر (دکمه تم و پروفایل) -->
      <div class="flex items-center gap-3">
        <!-- دکمه سوئیچ تم با آیکون انیمیشنی -->
        <button 
          (click)="themeService.toggleTheme()" 
          type="button"
          [title]="themeService.theme() === 'dark' ? 'تغییر به حالت روشن' : 'تغییر به حالت تاریک'"
          class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer active:scale-90 text-sm">
          @if (themeService.theme() === 'dark') {
            ☀️
          } @else {
            🌙
          }
        </button>

        <!-- آواتار کاربر -->
        <div class="w-9 h-9 rounded-xl bg-blue-600/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold text-sm">
          {{ currentUser()?.name?.charAt(0) || 'A' }}
        </div>
      </div>
    </header>

    <!-- ناحیه اصلی اسکرول روت‌ها -->
    <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-slate-950 transition-colors">
      <router-outlet />
    </main>

  </div>

</div>
<app-toast-container />
