<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 shadow-xs hover:shadow-md transition-all flex flex-col justify-between">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">{{ title() }}</p>
      <h3 class="text-2xl font-bold text-slate-800 dark:text-white mt-1 font-mono tracking-tight">{{ value() }}</h3>
    </div>
    <div [class]="'w-12 h-12 rounded-xl border flex items-center justify-center text-xl select-none ' + colorClasses()">
      {{ icon() }}
    </div>
  </div>

  <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
    <div class="flex items-center gap-1 font-medium" 
         [class.text-emerald-600]="isPositiveChange()" 
         [class.dark:text-emerald-400]="isPositiveChange()"
         [class.text-rose-600]="!isPositiveChange()"
         [class.dark:text-rose-400]="!isPositiveChange()">
      <span>{{ isPositiveChange() ? '↑' : '↓' }}</span>
      <span class="font-mono">{{ isPositiveChange() ? '+' : '' }}{{ changeRate() }}%</span>
      <span class="text-slate-400 dark:text-slate-500 font-normal mr-1">نسبت به ماه قبل</span>
    </div>
  </div>
</div>
