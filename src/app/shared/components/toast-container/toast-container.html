<div class="fixed top-5 left-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    @let styles = getToastStyles(toast.type);

    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl border backdrop-blur-md shadow-lg shadow-black/5 transition-all duration-300 animate-in fade-in slide-in-from-top-4 {{ styles.border }}">
      
      <!-- آیکون بر اساس نوع وضعیت -->
      <div class="shrink-0 w-8 h-8 rounded-xl flex items-center justify-center {{ styles.iconBg }}">
        @switch (toast.type) {
          @case ('success') {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
          }
          @case ('error') {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          }
          @case ('warning') {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
          }
          @default {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          }
        }
      </div>

      <!-- محتوای متن -->
      <div class="flex-1 min-w-0 pt-0.5">
        @if (toast.title) {
          <h4 class="text-sm font-semibold {{ styles.text }} leading-tight mb-1">
            {{ toast.title }}
          </h4>
        }
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed wrap-break-word">
          {{ toast.message }}
        </p>
      </div>

      <!-- دکمه بستن دستی -->
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition p-1 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
