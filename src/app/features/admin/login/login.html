<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4" dir="rtl">
  <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/80 shadow-xl p-8 space-y-6">
    <div class="text-center">
      <div class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-xl font-bold mx-auto mb-3 shadow-md shadow-blue-500/20">
        A
      </div>
      <h2 class="text-2xl font-bold text-slate-800">ورود به پنل مدیریت</h2>
      <p class="text-sm text-slate-500 mt-1">مشخصات حساب خود را وارد کنید</p>
    </div>

    @if (errorMessage()) {
      <div class="p-3 text-xs bg-rose-50 border border-rose-200 text-rose-600 rounded-xl">
        {{ errorMessage() }}
      </div>
    }

    <form (submit)="handleLogin(); $event.preventDefault()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">ایمیل ادمین</label>
        <input 
          type="email" 
          [value]="email()"
          (input)="onEmailChange($event)"
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="admin@domain.com"
        />
      </div>

      <button 
        type="submit"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-600/20 transition-all cursor-pointer">
        ورود به حساب
      </button>
    </form>
  </div>
</div>
